/* ============================== UNITS ============================== */
const U = (unit, grams) => ({ unit, grams });
function unitsFor(food) {
  const pg = food.pieceGrams;
  switch (food.cat) {
    case "roti": return [U("piece", pg || 40), U("g", 1)];
    case "breakfast": return pg ? [U("piece", pg), U("g", 1), U("katori", 150)] : [U("g", 1), U("katori", 150), U("bowl", 200)];
    case "rice": return [U("g", 1), U("katori", 150), U("bowl", 200), U("cup", 200)];
    case "dal": return [U("g", 1), U("katori", 150), U("bowl", 200)];
    case "sabzi": return [U("g", 1), U("katori", 150), U("bowl", 200)];
    case "dairy": return [U("g", 1), U("ml", 1), U("katori", 150), U("glass", 250), U("cup", 240)];
    case "fruit": return [U("piece", pg || 150), U("g", 1)];
    case "nuts": return [U("g", 1), U("tbsp", 10)];
    case "oil": return [U("g", 1), U("tsp", 5), U("tbsp", 15)];
    case "beverage": return [U("ml", 1), U("cup", pg || 150), U("glass", 250)];
    case "nonveg": return pg ? [U("piece", pg), U("g", 1)] : [U("g", 1), U("katori", 150)];
    case "snack": return pg ? [U("piece", pg), U("g", 1)] : [U("g", 1), U("katori", 150)];
    default: return [U("g", 1), U("serving", 100)];
  }
}
function gramsFor(food, qty, unit) {
  const opts = unitsFor(food);
  const match = opts.find((o) => o.unit === unit) || opts[0];
  return qty * match.grams;
}
function nutrientsFor(food, grams) {
  const r = grams / 100;
  const p = food.per100;
  return { cal: p.cal * r, protein: p.protein * r, carbs: p.carbs * r, fat: p.fat * r, fiber: p.fiber * r, sugar: (p.sugar || 0) * r, sodium: (p.sodium || 0) * r };
}
const round = (n, d = 0) => { const m = Math.pow(10, d); return Math.round((n + Number.EPSILON) * m) / m; };

/* ============================== CALCULATION ENGINE ============================== */
function calcBMI(weightKg, heightCm) {
  if (!weightKg || !heightCm) return null;
  const h = heightCm / 100;
  return weightKg / (h * h);
}
function bmiCategory(bmi) {
  if (bmi == null) return "—";
  if (bmi < 18.5) return "Underweight";
  if (bmi < 25) return "Normal";
  if (bmi < 30) return "Overweight";
  return "Obese";
}
function healthyWeightRange(heightCm) {
  const h = heightCm / 100;
  return [round(18.5 * h * h, 1), round(24.9 * h * h, 1)];
}
function bmrMifflin(w, h, age, gender) {
  return gender === "male" ? 10 * w + 6.25 * h - 5 * age + 5 : 10 * w + 6.25 * h - 5 * age - 161;
}
function bmrHarrisBenedict(w, h, age, gender) {
  return gender === "male" ? 88.362 + 13.397 * w + 4.799 * h - 5.677 * age : 447.593 + 9.247 * w + 3.098 * h - 4.33 * age;
}
function bmrRevisedHB(w, h, age, gender) {
  return gender === "male" ? 13.397 * w + 4.799 * h - 5.677 * age + 88.362 : 9.247 * w + 3.098 * h - 4.33 * age + 447.593;
}

const MEAL_SLOTS = [
  { key: "earlyMorning", label: "Early Morning", defaultTime: "06:30" },
  { key: "breakfast", label: "Breakfast", defaultTime: "08:30" },
  { key: "midMorning", label: "Mid-Morning", defaultTime: "11:00" },
  { key: "lunch", label: "Lunch", defaultTime: "13:30" },
  { key: "eveningSnack", label: "Evening Snack", defaultTime: "17:00" },
  { key: "dinner", label: "Dinner", defaultTime: "20:30" },
  { key: "bedtime", label: "Bedtime", defaultTime: "22:00" },
];
const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];

function emptyDay() {
  const d = {};
  MEAL_SLOTS.forEach((m) => (d[m.key] = []));
  return d;
}
function emptyWeek() {
  const w = {};
  DAYS.forEach((day) => (w[day] = emptyDay()));
  return w;
}

function itemNutrients(item, foodIndex) {
  if (item.override) return item.override;
  const food = foodIndex[item.foodId];
  if (!food) return { cal: 0, protein: 0, carbs: 0, fat: 0, fiber: 0, sugar: 0, sodium: 0 };
  const grams = gramsFor(food, item.qty, item.unit);
  return nutrientsFor(food, grams);
}
function sumNutrients(list) {
  return list.reduce((acc, n) => ({
    cal: acc.cal + n.cal, protein: acc.protein + n.protein, carbs: acc.carbs + n.carbs,
    fat: acc.fat + n.fat, fiber: acc.fiber + n.fiber, sugar: acc.sugar + n.sugar, sodium: acc.sodium + n.sodium,
  }), { cal: 0, protein: 0, carbs: 0, fat: 0, fiber: 0, sugar: 0, sodium: 0 });
}
function mealTotals(items, foodIndex) {
  return sumNutrients(items.map((it) => itemNutrients(it, foodIndex)));
}
function dayTotals(day, foodIndex) {
  const all = MEAL_SLOTS.flatMap((m) => day[m.key] || []);
  return mealTotals(all, foodIndex);
}
function weekTotals(week, foodIndex) {
  return DAYS.map((d) => dayTotals(week[d], foodIndex));
}

/* ============================== CLIENT EXPORT / IMPORT LAYER ============================== */
const APP_NAME = "NutriCore Dietitian Diet Planner";
const SCHEMA_VERSION = 1;
const APP_VERSION = "1.0.0";

function genClientId() {
  const d = new Date();
  const ymd = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
  const rand = Math.random().toString(36).slice(2, 7).toUpperCase();
  return `CL-${ymd}-${rand}`;
}

function safeFileName(str) {
  return (str || "").trim().replace(/[^a-zA-Z0-9_\- ]/g, "").replace(/\s+/g, "_");
}

/* Walk the week and collect a full snapshot of every food actually referenced in the diet,
   so the diet can be reconstructed later even if that food is later edited/removed
   from the live food database. */
function buildFoodSnapshot(week, foodIndex) {
  const snapshot = {};
  DAYS.forEach((day) => {
    MEAL_SLOTS.forEach((m) => {
      (week[day][m.key] || []).forEach((item) => {
        if (item.foodId && foodIndex[item.foodId] && !snapshot[item.foodId]) {
          snapshot[item.foodId] = foodIndex[item.foodId];
        }
      });
    });
  });
  return snapshot;
}

/* Build the complete portable client record from the app's live state. */
function serializeClient(state) {
  const {
    clientId, patient, customFoods, week, foodIndex, activeDay, instructions,
    bmrFormula, goal, bmrOverride, calorieOverride,
    macroMethod, macroPct, macroPerKg, macroManual, microTargets, mealPct, mealTimes,
  } = state;

  return {
    application: APP_NAME,
    exportType: "client",
    version: APP_VERSION,
    schemaVersion: SCHEMA_VERSION,
    exportDate: new Date().toISOString(),
    clientId,
    clientName: patient.name || "",
    client: {
      patient,
      settings: {
        bmrFormula, goal, bmrOverride, calorieOverride,
        macroMethod, macroPct, macroPerKg, macroManual,
        microTargets, mealPct, mealTimes,
      },
      dietPlan: { week, activeDay },
      instructions,
      customFoods,
      foodSnapshot: buildFoodSnapshot(week, foodIndex),
    },
  };
}

/* Validate an imported file's structure before trusting it. Returns { ok, error, data } */
function validateClientFile(parsed) {
  if (!parsed || typeof parsed !== "object") {
    return { ok: false, error: "This file is not a valid NutriCore client file." };
  }
  if (parsed.application !== APP_NAME || parsed.exportType !== "client") {
    return { ok: false, error: "This file is not a valid NutriCore Dietitian Diet Planner client file." };
  }
  if (!parsed.client || typeof parsed.client !== "object") {
    return { ok: false, error: "This client file is missing its data and cannot be imported." };
  }
  if (parsed.schemaVersion && parsed.schemaVersion > SCHEMA_VERSION) {
    return { ok: false, error: "This client file was created by a newer version of NutriCore. Please update the app." };
  }
  return { ok: true, data: migrateClientData(parsed) };
}

/* Simple migration hook — transforms older schema versions into the current shape.
   Currently a no-op pass-through since we're at schemaVersion 1, but keeps the
   architecture ready for future schema changes. */
function migrateClientData(parsed) {
  return parsed;
}

/* Restore application state fields from a validated import, filling sensible
   defaults for anything missing so the app never crashes on a partial file. */
function deserializeClient(parsed, defaults) {
  const c = parsed.client || {};
  const patient = { ...defaults.patient, ...(c.patient || {}) };
  const settings = c.settings || {};
  const dietPlan = c.dietPlan || {};
  const week = dietPlan.week || defaults.week;
  const activeDay = dietPlan.activeDay || defaults.activeDay;
  const instructions = Array.isArray(c.instructions) ? c.instructions : defaults.instructions;
  const importedCustomFoods = Array.isArray(c.customFoods) ? c.customFoods : [];
  const foodSnapshot = c.foodSnapshot || {};

  return {
    clientId: parsed.clientId || genClientId(),
    patient,
    week,
    activeDay,
    instructions,
    importedCustomFoods,
    foodSnapshot,
    bmrFormula: settings.bmrFormula || defaults.bmrFormula,
    goal: settings.goal || defaults.goal,
    bmrOverride: settings.bmrOverride != null ? settings.bmrOverride : null,
    calorieOverride: settings.calorieOverride != null ? settings.calorieOverride : null,
    macroMethod: settings.macroMethod || defaults.macroMethod,
    macroPct: settings.macroPct || defaults.macroPct,
    macroPerKg: settings.macroPerKg || defaults.macroPerKg,
    macroManual: settings.macroManual || defaults.macroManual,
    microTargets: settings.microTargets || defaults.microTargets,
    mealPct: settings.mealPct || defaults.mealPct,
    mealTimes: settings.mealTimes || defaults.mealTimes,
  };
}

function downloadJSON(obj, filename) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function NutrientRing({ value, target, size = 180, stroke = 14, color, label, sublabel, theme, unit = "" }) {

        strokeDasharray={c} strokeDashoffset={offset} transform={`rotate(-90 ${size / 2} ${size / 2})`}

          <Pencil size={12} color={theme.textFaint} style={{ cursor: "pointer" }} onClick={() => setEditing((e) => !e)} />
          <Trash2 size={12} color={theme.textFaint} style={{ cursor: "pointer" }} onClick={onRemove} />
        </div>
      </div>
      {editing && (
        <div className="grid grid-cols-4 gap-1.5 mt-1 p-2 rounded-lg" style={{ background: "rgba(127,127,127,0.06)" }}>
          {["cal", "protein", "carbs", "fat"].map((k) => (
            <label key={k} className="flex flex-col gap-0.5">
              <span style={{ fontSize: 9.5, color: theme.textFaint, textTransform: "uppercase" }}>{k}</span>
              <input type="number" defaultValue={round(n[k], 1)} onBlur={(e) => {
                const val = parseFloat(e.target.value) || 0;
                const base = item.override || n;
                onEditOverride({ ...base, [k]: val });
              }} style={{ ...inputStyle(theme), padding: "4px 6px", fontSize: 11.5 }} />
            </label>
          ))}
          {isOverridden && <button onClick={() => onEditOverride(null)} style={{ gridColumn: "span 4", fontSize: 10.5, color: theme.accent, textAlign: "left", marginTop: 2 }}>Reset to database value</button>}
        </div>
      )}
    </div>
  );
}

/* ============================== MEAL CARD ============================== */
function MealCard({ slot, items, foodIndex, theme, onAdd, onRemove, onEditOverride, targetCal, patient, mealTime, onTimeChange }) {
  const totals = mealTotals(items, foodIndex);
  const diff = totals.cal - targetCal;
  return (
    <Panel theme={theme} className="p-4 flex flex-col gap-2.5">
      <div className="flex items-center justify-between flex-wrap gap-2">
        <div className="flex items-center gap-2">
          <span style={{ fontWeight: 700, fontSize: 14.5, color: theme.text, fontFamily: "Space Grotesk, sans-serif" }}>{slot.label}</span>
          <input type="time" value={mealTime} onChange={(e) => onTimeChange(e.target.value)}
            style={{ background: "transparent", border: "none", color: theme.textFaint, fontSize: 11.5, fontFamily: "JetBrains Mono, monospace" }} />
        </div>
        {targetCal > 0 && (
          <span style={{ fontSize: 11, fontFamily: "JetBrains Mono, monospace", color: Math.abs(diff) < 50 ? theme.accent : theme.warn }}>
            Target {round(targetCal)} · Actual {round(totals.cal)} · {diff >= 0 ? "+" : ""}{round(diff)} kcal
          </span>
        )}
      </div>
      {items.length > 0 && (
        <div className="flex flex-col">
          {items.map((it) => (
            <MealItemRow key={it.uid} item={it} food={foodIndex[it.foodId]} theme={theme} foodIndex={foodIndex} patient={patient}
              onRemove={() => onRemove(it.uid)} onEditOverride={(ov) => onEditOverride(it.uid, ov)} />
          ))}
        </div>
      )}
      <FoodPicker theme={theme} foodIndex={foodIndex} allFoods={Object.values(foodIndex)} onAdd={(item) => onAdd(item)} patient={patient} />
      <div className="flex gap-3 flex-wrap pt-1">
        {[["Protein", totals.protein, theme.accent, "g"], ["Carbs", totals.carbs, theme.accent2, "g"], ["Fat", totals.fat, theme.warn, "g"], ["Fibre", totals.fiber, theme.fiber, "g"]].map(([label, val, color]) => (
          <span key={label} style={{ fontSize: 10.5, color: theme.textMuted, fontFamily: "JetBrains Mono, monospace" }}>
            <span style={{ color }}>●</span> {label} {round(val, 1)}g
          </span>
        ))}
      </div>
    </Panel>
  );
}

/* ============================== APP ============================== */
const DEFAULT_PATIENT = {
  name: "", patientId: "PT-" + Math.floor(1000 + Math.random() * 9000), age: 28, dob: "", gender: "female",
  height: 165, weight: 70, targetWeight: 62, occupation: "", activityLevel: "moderate",
  dietaryPreference: "vegetarian", foodPreferences: "", foodDislikes: "", allergies: "", intolerances: "",
  medicalConditions: "", medications: "", lifestyleNotes: "", sleepHours: 7, waterIntake: 2.5,
  exerciseFreq: "3-4x/week", exerciseType: "Walking", mealsPerDay: 5, notes: "",
};
const DEFAULT_INSTRUCTIONS = [
  "Drink at least 2.5–3 litres of water daily",
  "Avoid sugary drinks and packaged juices",
  "Limit fried and processed foods",
  "Walk for at least 30 minutes daily",
  "Follow meal timings as closely as possible",
];

function App() {
  const [themeMode, setThemeMode] = useState("dark");
  const theme = THEMES[themeMode];
  const [tab, setTab] = useState("dashboard");

  const [clientId, setClientId] = useState(() => genClientId());
  const [toast, setToast] = useState(null);
  const [pendingAction, setPendingAction] = useState(null); // { type: 'import'|'new', file? }
  const fileInputRef = useRef(null);

  const showToast = useCallback((title, detail, type = "success") => {
    setToast({ title, detail, type });
  }, []);
  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 4200);
    return () => clearTimeout(t);
  }, [toast]);

  const [patient, setPatient] = useState({ ...DEFAULT_PATIENT });

  const [customFoods, setCustomFoods] = useState([]);
  const allFoods = useMemo(() => [...FOODS_SEED, ...customFoods], [customFoods]);
  const foodIndex = useMemo(() => Object.fromEntries(allFoods.map((f) => [f.id, f])), [allFoods]);

  const [bmrFormula, setBmrFormula] = useState("mifflin");
  const [goal, setGoal] = useState("loss");
  const [bmrOverride, setBmrOverride] = useState(null);
  const [calorieOverride, setCalorieOverride] = useState(null);
  const [macroMethod, setMacroMethod] = useState("percentage");
  const [macroPct, setMacroPct] = useState({ protein: 25, carbs: 45, fat: 30 });
  const [macroPerKg, setMacroPerKg] = useState({ protein: 1.2, fat: 0.8 });
  const [macroManual, setMacroManual] = useState({ protein: 90, carbs: 180, fat: 55 });
  const [microTargets, setMicroTargets] = useState({ fiber: 28, sugar: 30, sodium: 2000 });
  const [mealPct, setMealPct] = useState({ earlyMorning: 5, breakfast: 20, midMorning: 10, lunch: 30, eveningSnack: 10, dinner: 20, bedtime: 5 });
  const [mealTimes, setMealTimes] = useState(Object.fromEntries(MEAL_SLOTS.map((m) => [m.key, m.defaultTime])));

  const [week, setWeek] = useState(emptyWeek());
  const [activeDay, setActiveDay] = useState("Monday");
  const [instructions, setInstructions] = useState([...DEFAULT_INSTRUCTIONS]);

  const bmi = calcBMI(patient.weight, patient.height);
  const [wLow, wHigh] = healthyWeightRange(patient.height || 0);
  const bmrCalc = BMR_FORMULAS[bmrFormula].fn(patient.weight, patient.height, patient.age, patient.gender);
  const bmr = bmrOverride != null ? bmrOverride : bmrCalc;
  const activityFactor = ACTIVITY_FACTORS[patient.activityLevel].factor;
  const tdee = bmr * activityFactor;
  const goalTarget = tdee + GOALS[goal].adjust;
  const targetCalories = calorieOverride != null ? calorieOverride : round(goalTarget);

  const macroGrams = useMemo(() => {
    if (macroMethod === "percentage") {
      return {
        protein: round((targetCalories * macroPct.protein / 100) / 4, 1),
        carbs: round((targetCalories * macroPct.carbs / 100) / 4, 1),
        fat: round((targetCalories * macroPct.fat / 100) / 9, 1),
      };
    }
    if (macroMethod === "perKg") {
      const proteinG = round(macroPerKg.protein * patient.weight, 1);
      const fatG = round(macroPerKg.fat * patient.weight, 1);
      const remaining = targetCalories - proteinG * 4 - fatG * 9;
      return { protein: proteinG, fat: fatG, carbs: round(Math.max(remaining, 0) / 4, 1) };
    }
    return macroManual;
  }, [macroMethod, macroPct, macroPerKg, macroManual, targetCalories, patient.weight]);

  const macroCalBreakdown = {
    protein: macroGrams.protein * 4, carbs: macroGrams.carbs * 4, fat: macroGrams.fat * 9,
  };
  const macroCalTotal = macroCalBreakdown.protein + macroCalBreakdown.carbs + macroCalBreakdown.fat;

  const foodIndexAll = foodIndex;
  const currentDay = week[activeDay];
  const dToday = dayTotals(currentDay, foodIndexAll);
  const wTotalsArr = useMemo(() => weekTotals(week, foodIndexAll), [week, foodIndexAll]);
  const weekAvg = useMemo(() => {
    const s = sumNutrients(wTotalsArr);
    const n = DAYS.length;
    return { cal: s.cal / n, protein: s.protein / n, carbs: s.carbs / n, fat: s.fat / n, fiber: s.fiber / n, sugar: s.sugar / n, sodium: s.sodium / n };
  }, [wTotalsArr]);

  const updateDay = useCallback((day, fn) => {
    setWeek((w) => ({ ...w, [day]: fn(w[day]) }));
  }, []);
  const addItem = (day, slotKey, item) => updateDay(day, (d) => ({ ...d, [slotKey]: [...d[slotKey], item] }));
  const removeItem = (day, slotKey, uid) => updateDay(day, (d) => ({ ...d, [slotKey]: d[slotKey].filter((i) => i.uid !== uid) }));
  const editOverride = (day, slotKey, uid, override) => updateDay(day, (d) => ({ ...d, [slotKey]: d[slotKey].map((i) => i.uid === uid ? { ...i, override } : i) }));

  const copyDay = (from, to) => setWeek((w) => ({
    ...w,
    [to]: Object.fromEntries(MEAL_SLOTS.map((m) => [m.key, w[from][m.key].map((it) => ({ ...it, uid: Math.random().toString(36).slice(2) }))])),
  }));

  const balanceDay = () => {
    const remaining = targetCalories - dToday.cal;
    if (remaining < 60) return;
    const suggestions = [];
    let left = remaining;
    const bank = [foodIndex["apple"], foodIndex["almonds"], foodIndex["curd"], foodIndex["banana"]];
    for (const food of bank) {
      if (left < 40) break;
      const grams = food.cat === "nuts" ? 10 : 100;
      const n = nutrientsFor(food, grams);
      if (n.cal <= left + 60) { suggestions.push({ food, grams, n }); left -= n.cal; }
    }
    if (suggestions.length) {
      updateDay(activeDay, (d) => ({ ...d, eveningSnack: [...d.eveningSnack, ...suggestions.map((s) => ({ uid: Math.random().toString(36).slice(2), foodId: s.food.id, qty: s.grams, unit: "g", override: null }))] }));
    }
  };

  const allergyList = patient.allergies.split(",").map((s) => s.trim().toLowerCase()).filter(Boolean);
  const allergyConflicts = useMemo(() => {
    let count = 0;
    DAYS.forEach((day) => MEAL_SLOTS.forEach((m) => (week[day][m.key] || []).forEach((it) => {
      const food = foodIndex[it.foodId];
      if (food && allergyList.some((a) => food.name.toLowerCase().includes(a) || (food.tags || []).some((t) => t.includes(a)))) count++;
    })));
    return count;
  }, [week, foodIndex, allergyList]);

  /* ============================== CLIENT EXPORT / IMPORT ============================== */
  const hasUnsavedData = useCallback(() => {
    const hasWeekItems = DAYS.some((day) => MEAL_SLOTS.some((m) => (week[day][m.key] || []).length > 0));
    return Boolean((patient.name && patient.name.trim()) || hasWeekItems || customFoods.length > 0);
  }, [patient, week, customFoods]);

  const applyImportedData = useCallback((parsed) => {
    const restored = deserializeClient(parsed, {
      patient: DEFAULT_PATIENT, week: emptyWeek(), activeDay: "Monday", instructions: DEFAULT_INSTRUCTIONS,
      bmrFormula: "mifflin", goal: "loss", macroMethod: "percentage",
      macroPct: { protein: 25, carbs: 45, fat: 30 }, macroPerKg: { protein: 1.2, fat: 0.8 },
      macroManual: { protein: 90, carbs: 180, fat: 55 }, microTargets: { fiber: 28, sugar: 30, sodium: 2000 },
      mealPct: { earlyMorning: 5, breakfast: 20, midMorning: 10, lunch: 30, eveningSnack: 10, dinner: 20, bedtime: 5 },
      mealTimes: Object.fromEntries(MEAL_SLOTS.map((m) => [m.key, m.defaultTime])),
    });

    // Merge the imported client's custom foods and its historical food snapshot into
    // the CURRENT custom food database rather than replacing it — this preserves any
    // other custom foods the dietitian has already built up, while guaranteeing this
    // client's diet resolves correctly even if a food was since edited or removed.
    const merged = new Map(customFoods.map((f) => [f.id, f]));
    restored.importedCustomFoods.forEach((f) => { if (f && f.id) merged.set(f.id, f); });
    Object.values(restored.foodSnapshot || {}).forEach((f) => {
      if (f && f.id && !FOODS_SEED.some((sf) => sf.id === f.id) && !merged.has(f.id)) merged.set(f.id, f);
    });
    const mergedCustomFoods = Array.from(merged.values());

    setClientId(restored.clientId);
    setPatient(restored.patient);
    setCustomFoods(mergedCustomFoods);
    setWeek(restored.week);
    setActiveDay(restored.activeDay);
    setInstructions(restored.instructions);
    setBmrFormula(restored.bmrFormula);
    setGoal(restored.goal);
    setBmrOverride(restored.bmrOverride);
    setCalorieOverride(restored.calorieOverride);
    setMacroMethod(restored.macroMethod);
    setMacroPct(restored.macroPct);
    setMacroPerKg(restored.macroPerKg);
    setMacroManual(restored.macroManual);
    setMicroTargets(restored.microTargets);
    setMealPct(restored.mealPct);
    setMealTimes(restored.mealTimes);
    setTab("patient");
    showToast("Client record imported successfully.", restored.patient.name ? `Loaded ${restored.patient.name}` : undefined);
  }, [showToast, customFoods]);

  const handleExportClient = useCallback(() => {
    const payload = serializeClient({
      clientId, patient, customFoods, week, foodIndex, activeDay, instructions,
      bmrFormula, goal, bmrOverride, calorieOverride,
      macroMethod, macroPct, macroPerKg, macroManual, microTargets, mealPct, mealTimes,
    });
    const namePart = safeFileName(patient.name) || "Client";
    const datePart = new Date().toISOString().slice(0, 10);
    const filename = `${namePart}_${datePart}_DietPlan.json`;
    downloadJSON(payload, filename);
    showToast("Client record exported successfully.", `File: ${filename}`);
  }, [clientId, patient, customFoods, week, foodIndex, activeDay, instructions, bmrFormula, goal, bmrOverride, calorieOverride, macroMethod, macroPct, macroPerKg, macroManual, microTargets, mealPct, mealTimes, showToast]);

  const triggerImportPicker = useCallback(() => {
    if (hasUnsavedData()) {
      setPendingAction({ type: "import" });
    } else {
      fileInputRef.current && fileInputRef.current.click();
    }
  }, [hasUnsavedData]);

  const onFileSelected = useCallback((e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = ""; // allow re-selecting the same file later
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try {
        parsed = JSON.parse(reader.result);
      } catch (err) {
        showToast("Import failed", "This file is not valid JSON.", "error");
        return;
      }
      const result = validateClientFile(parsed);
      if (!result.ok) {
        showToast("Import failed", result.error, "error");
        return;
      }
      applyImportedData(result.data);
    };
    reader.onerror = () => showToast("Import failed", "Could not read the selected file.", "error");
    reader.readAsText(file);
  }, [applyImportedData, showToast]);

  const handleNewClient = useCallback(() => {
    if (hasUnsavedData()) {
      setPendingAction({ type: "new" });
    } else {
      resetToNewClient();
    }
  }, [hasUnsavedData]);

  function resetToNewClient() {
    setClientId(genClientId());
    setPatient({ ...DEFAULT_PATIENT, patientId: "PT-" + Math.floor(1000 + Math.random() * 9000) });
    setWeek(emptyWeek());
    setActiveDay("Monday");
    setInstructions([...DEFAULT_INSTRUCTIONS]);
    setBmrFormula("mifflin");
    setGoal("loss");
    setBmrOverride(null);
    setCalorieOverride(null);
    setMacroMethod("percentage");
    setMacroPct({ protein: 25, carbs: 45, fat: 30 });
    setMacroPerKg({ protein: 1.2, fat: 0.8 });
    setMacroManual({ protein: 90, carbs: 180, fat: 55 });
    setMicroTargets({ fiber: 28, sugar: 30, sodium: 2000 });
    setMealPct({ earlyMorning: 5, breakfast: 20, midMorning: 10, lunch: 30, eveningSnack: 10, dinner: 20, bedtime: 5 });
    setMealTimes(Object.fromEntries(MEAL_SLOTS.map((m) => [m.key, m.defaultTime])));
    setTab("patient");
    // customFoods (the food database) is intentionally left untouched — "New Client" only clears client-specific data.
  }

  const NAV = [
    { key: "dashboard", label: "Dashboard", icon: LayoutDashboard },
    { key: "patient", label: "Patient Profile", icon: User },
    { key: "requirements", label: "Requirements", icon: Calculator },
    { key: "foods", label: "Food Database", icon: Search },
    { key: "daily", label: "Daily Plan", icon: UtensilsCrossed },
    { key: "weekly", label: "Weekly Planner", icon: CalendarDays },
    { key: "chart", label: "Diet Chart", icon: FileText },
    { key: "analytics", label: "Analytics", icon: BarChart3 },
  ];

  const macroChartData = [
    { name: "Protein", value: macroCalBreakdown.protein, color: theme.accent },
    { name: "Carbs", value: macroCalBreakdown.carbs, color: theme.accent2 },
    { name: "Fat", value: macroCalBreakdown.fat, color: theme.warn },
  ];
  const weeklyBarData = DAYS.map((d, i) => ({ day: d.slice(0, 3), calories: round(wTotalsArr[i].cal) }));

  return (
    <div style={{ background: theme.bg, minHeight: "100%", color: theme.text, fontFamily: "Inter, sans-serif" }}>
      <style>{`
        @import url('${FONT_LINK}');
        * { box-sizing: border-box; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: ${theme.panelBorder}; border-radius: 8px; }
        input[type=number]::-webkit-inner-spin-button { opacity: 1; }
        @media print {
          .no-print { display: none !important; }
          .print-area { color: #111 !important; background: #fff !important; }
        }
        @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      `}</style>
      <input ref={fileInputRef} type="file" accept="application/json,.json" onChange={onFileSelected} className="no-print" style={{ display: "none" }} />
      <Toast toast={toast} theme={theme} />
      {pendingAction && pendingAction.type === "new" && (
        <ConfirmDialog theme={theme} title="Start a new client?"
          message="You currently have a client record open. Starting a new client will clear the current patient information and diet plan from the screen (your food database is kept). Make sure you've exported this client first if you want to keep their data."
          confirmLabel="Start New Client"
          onCancel={() => setPendingAction(null)}
          onConfirm={() => { resetToNewClient(); setPendingAction(null); }} />
      )}
      {pendingAction && pendingAction.type === "import" && (
        <ConfirmDialog theme={theme} title="Import another client?"
          message="You currently have a client record open. Importing another file will replace the current patient information and diet plan on screen. Make sure you've exported this client first if you want to keep their data."
          confirmLabel="Continue"
          onCancel={() => setPendingAction(null)}
          onConfirm={() => { setPendingAction(null); fileInputRef.current && fileInputRef.current.click(); }} />
      )}
      <div className="flex" style={{ minHeight: "100%" }}>
        {/* Sidebar */}
        <div className="no-print flex flex-col shrink-0" style={{ width: 232, borderRight: `1px solid ${theme.divider}`, padding: 18, background: theme.bg2 }}>
          <div className="flex items-center gap-2 mb-6 px-1">
            <div style={{ width: 34, height: 34, borderRadius: 10, background: `linear-gradient(135deg, ${theme.accent}, ${theme.accent2})`, display: "flex", alignItems: "center", justifyContent: "center" }}>
              <Sparkles size={17} color="#06110D" />
            </div>
            <div>
              <div style={{ fontFamily: "Space Grotesk, sans-serif", fontWeight: 700, fontSize: 15, lineHeight: 1.1 }}>NutriCore</div>
              <div style={{ fontSize: 10, color: theme.textFaint, letterSpacing: 0.5 }}>DIETITIAN OS</div>
            </div>
          </div>
          <div className="flex flex-col gap-1">
            {NAV.map((n) => {
              const Icon = n.icon;
              const active = tab === n.key;
              return (
                <button key={n.key} onClick={() => setTab(n.key)} className="flex items-center gap-2.5 text-left transition-all"
                  style={{ padding: "9px 11px", borderRadius: 10, background: active ? `${theme.accent}18` : "transparent", color: active ? theme.accent : theme.textMuted, fontSize: 13, fontWeight: 600, border: active ? `1px solid ${theme.accent}33` : "1px solid transparent" }}>
                  <Icon size={15} /> {n.label}
                </button>
              );
            })}
          </div>
          <div className="flex flex-col gap-2 pt-5 mt-5" style={{ borderTop: `1px solid ${theme.divider}` }}>
            <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: 0.8, color: theme.textFaint, padding: "0 2px" }}>CLIENT RECORD</div>
            <div style={{ fontSize: 10.5, color: theme.textFaint, padding: "0 2px", fontFamily: "JetBrains Mono, monospace" }}>{clientId}</div>
            <button onClick={handleNewClient} className="flex items-center gap-2 px-2.5 py-2 rounded-lg transition-all" style={{ border: `1px solid ${theme.panelBorder}`, color: theme.textMuted, fontSize: 12, fontWeight: 600 }}>
              <UserPlus size={13} /> New Client
            </button>
            <button onClick={triggerImportPicker} className="flex items-center gap-2 px-2.5 py-2 rounded-lg transition-all" style={{ border: `1px solid ${theme.panelBorder}`, color: theme.textMuted, fontSize: 12, fontWeight: 600 }}>
              <FolderInput size={13} /> Import Client
            </button>
            <button onClick={handleExportClient} className="flex items-center gap-2 px-2.5 py-2 rounded-lg transition-all" style={{ border: `1px solid ${theme.accent}55`, background: `${theme.accent}14`, color: theme.accent, fontSize: 12, fontWeight: 700 }}>
              <Download size={13} /> Export Client
            </button>
            <div style={{ fontSize: 10, color: theme.textFaint, padding: "0 2px", lineHeight: 1.4 }}>Client files save locally to your device — nothing is uploaded.</div>
          </div>

          <div className="mt-auto flex flex-col gap-2 pt-4">
            {allergyConflicts > 0 && (
              <div className="flex items-center gap-1.5 px-2.5 py-2 rounded-lg" style={{ background: `${theme.danger}14`, color: theme.danger, fontSize: 11 }}>
                <AlertTriangle size={13} /> {allergyConflicts} allergy conflict{allergyConflicts > 1 ? "s" : ""} in plan
              </div>
            )}
            <button onClick={() => setThemeMode(themeMode === "dark" ? "light" : "dark")} className="flex items-center gap-2 px-2.5 py-2 rounded-lg" style={{ border: `1px solid ${theme.panelBorder}`, color: theme.textMuted, fontSize: 12 }}>
              {themeMode === "dark" ? <Sun size={13} /> : <Moon size={13} />} {themeMode === "dark" ? "Light mode" : "Dark mode"}
            </button>
          </div>
        </div>

        {/* Main */}
        <div className="flex-1 min-w-0" style={{ padding: "24px 30px" }}>
          {tab === "dashboard" && (
            <DashboardTab theme={theme} patient={patient} bmi={bmi} targetCalories={targetCalories} dToday={dToday} weekAvg={weekAvg} setTab={setTab} />
          )}
          {tab === "patient" && <PatientTab theme={theme} patient={patient} setPatient={setPatient} />}
          {tab === "requirements" && (
            <RequirementsTab theme={theme} patient={patient} bmi={bmi} wLow={wLow} wHigh={wHigh}
              bmrFormula={bmrFormula} setBmrFormula={setBmrFormula} bmrCalc={bmrCalc} bmr={bmr} bmrOverride={bmrOverride} setBmrOverride={setBmrOverride}
              activityFactor={activityFactor} tdee={tdee} goal={goal} setGoal={setGoal} targetCalories={targetCalories} calorieOverride={calorieOverride} setCalorieOverride={setCalorieOverride}
              macroMethod={macroMethod} setMacroMethod={setMacroMethod} macroPct={macroPct} setMacroPct={setMacroPct}
              macroPerKg={macroPerKg} setMacroPerKg={setMacroPerKg} macroManual={macroManual} setMacroManual={setMacroManual}
              macroGrams={macroGrams} macroCalBreakdown={macroCalBreakdown} macroCalTotal={macroCalTotal} macroChartData={macroChartData}
              microTargets={microTargets} setMicroTargets={setMicroTargets} mealPct={mealPct} setMealPct={setMealPct}
              setPatient={setPatient} />
          )}
          {tab === "foods" && <FoodsTab theme={theme} allFoods={allFoods} setCustomFoods={setCustomFoods} customFoods={customFoods} showToast={showToast} />}
          {tab === "daily" && (
            <DailyTab theme={theme} activeDay={activeDay} setActiveDay={setActiveDay} week={week} foodIndex={foodIndex}
              targetCalories={targetCalories} mealPct={mealPct} mealTimes={mealTimes} setMealTimes={setMealTimes}
              addItem={addItem} removeItem={removeItem} editOverride={editOverride} dToday={dToday} patient={patient}
              balanceDay={balanceDay} macroGrams={macroGrams} />
          )}
          {tab === "weekly" && (
            <WeeklyTab theme={theme} week={week} foodIndex={foodIndex} setActiveDay={setActiveDay} setTab={setTab}
              copyDay={copyDay} wTotalsArr={wTotalsArr} targetCalories={targetCalories} setWeek={setWeek} />
          )}
          {tab === "chart" && (
            <ChartTab theme={theme} patient={patient} week={week} foodIndex={foodIndex} targetCalories={targetCalories}

function FoodsTab({ theme, allFoods, setCustomFoods, customFoods, showToast }) {
  const [query, setQuery] = useState("");
  const [cat, setCat] = useState("all");
  const [diet, setDiet] = useState("all");
  const [showAdd, setShowAdd] = useState(false);
  const [form, setForm] = useState({ name: "", cal: "", protein: "", carbs: "", fat: "", fiber: "" });
  const dbFileInputRef = useRef(null);

  const exportFoodDatabase = () => {
    const payload = {
      application: APP_NAME, exportType: "foodDatabase", version: APP_VERSION,
      schemaVersion: SCHEMA_VERSION, exportDate: new Date().toISOString(), customFoods,
    };
    downloadJSON(payload, `NutriCore_FoodDatabase_${new Date().toISOString().slice(0, 10)}.json`);
    showToast && showToast("Food database exported successfully.", `${customFoods.length} custom food${customFoods.length === 1 ? "" : "s"} saved`);
  };
  const onDbFileSelected = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (parsed.application !== APP_NAME || parsed.exportType !== "foodDatabase" || !Array.isArray(parsed.customFoods)) {
          showToast && showToast("Import failed", "This is not a valid NutriCore food database file.", "error");
          return;
        }
        setCustomFoods((c) => {
          const merged = new Map(c.map((f) => [f.id, f]));
          parsed.customFoods.forEach((f) => { if (f && f.id) merged.set(f.id, f); });
          return Array.from(merged.values());
        });
        showToast && showToast("Food database imported successfully.", `${parsed.customFoods.length} custom food${parsed.customFoods.length === 1 ? "" : "s"} merged in`);
      } catch (err) {
        showToast && showToast("Import failed", "This file is not valid JSON.", "error");
      }
    };
    reader.readAsText(file);
  };

  const filtered = allFoods.filter((f) =>
    (query === "" || f.name.toLowerCase().includes(query.toLowerCase())) &&
    (cat === "all" || f.cat === cat) &&
    (diet === "all" || f.diet === diet)
  );

  const addCustom = () => {
    if (!form.name || !form.cal) return;
    const id = "custom_" + Math.random().toString(36).slice(2);
    setCustomFoods((c) => [...c, f(id, form.name, "snack", "Custom", "veg", parseFloat(form.cal) || 0, parseFloat(form.protein) || 0, parseFloat(form.carbs) || 0, parseFloat(form.fat) || 0, parseFloat(form.fiber) || 0)]);
    setForm({ name: "", cal: "", protein: "", carbs: "", fat: "", fiber: "" });
    setShowAdd(false);
  };

  return (
    <div className="flex flex-col gap-4">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <h1 style={{ fontFamily: "Space Grotesk, sans-serif", fontSize: 22, fontWeight: 700 }}>Food Database <span style={{ fontSize: 13, color: theme.textFaint, fontWeight: 400 }}>· {allFoods.length} items</span></h1>
        <div className="flex items-center gap-2">
          <input ref={dbFileInputRef} type="file" accept="application/json,.json" onChange={onDbFileSelected} style={{ display: "none" }} />
          <Btn theme={theme} small variant="ghost" icon={Upload} onClick={() => dbFileInputRef.current && dbFileInputRef.current.click()}>Import Foods</Btn>
          <Btn theme={theme} small variant="ghost" icon={Download} onClick={exportFoodDatabase}>Export Foods</Btn>
          <Btn theme={theme} icon={Plus} onClick={() => setShowAdd((s) => !s)}>Add Custom Food</Btn>
        </div>
      </div>
      {showAdd && (
        <Panel theme={theme} className="p-4 grid gap-3" style={{ gridTemplateColumns: "repeat(6,1fr)" }}>
          <TextInput theme={theme} placeholder="Food name" value={form.name} onChange={(e) => setForm((s) => ({ ...s, name: e.target.value }))} />
          <TextInput theme={theme} placeholder="Calories/100g" type="number" value={form.cal} onChange={(e) => setForm((s) => ({ ...s, cal: e.target.value }))} />
          <TextInput theme={theme} placeholder="Protein" type="number" value={form.protein} onChange={(e) => setForm((s) => ({ ...s, protein: e.target.value }))} />
          <TextInput theme={theme} placeholder="Carbs" type="number" value={form.carbs} onChange={(e) => setForm((s) => ({ ...s, carbs: e.target.value }))} />
          <TextInput theme={theme} placeholder="Fat" type="number" value={form.fat} onChange={(e) => setForm((s) => ({ ...s, fat: e.target.value }))} />
          <TextInput theme={theme} placeholder="Fibre" type="number" value={form.fiber} onChange={(e) => setForm((s) => ({ ...s, fiber: e.target.value }))} />
          <Btn theme={theme} small style={{ gridColumn: "span 2" }} icon={Check} onClick={addCustom}>Save to my database</Btn>
        </Panel>
      )}
      <div className="flex items-center gap-2 flex-wrap">
        <div className="flex items-center gap-2 flex-1" style={{ ...inputStyle(theme), minWidth: 220 }}>
          <Search size={14} color={theme.textFaint} />
          <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search foods…" style={{ background: "transparent", border: "none", outline: "none", color: theme.text, width: "100%", fontSize: 13.5 }} />
        </div>
      </div>
      <div className="flex gap-1.5 flex-wrap">
        <Pill theme={theme} active={cat === "all"} onClick={() => setCat("all")}>All Categories</Pill>
        {Object.entries(CAT_LABEL).map(([k, v]) => <Pill key={k} theme={theme} active={cat === k} onClick={() => setCat(k)}>{v}</Pill>)}
      </div>
      <div className="flex gap-1.5 flex-wrap">
        {["all", "vegan", "veg", "egg", "nonveg"].map((d) => (
          <Pill key={d} theme={theme} color={theme.accent2} active={diet === d} onClick={() => setDiet(d)}>{d === "all" ? "All Diets" : d}</Pill>
        ))}
      </div>
      <div className="grid gap-2.5" style={{ gridTemplateColumns: "repeat(auto-fill,minmax(260px,1fr))" }}>
        {filtered.map((f) => <FoodCard key={f.id} f={f} theme={theme} />)}
      </div>
      {filtered.length === 0 && <div style={{ color: theme.textFaint, fontSize: 13, padding: 20, textAlign: "center" }}>No foods match your filters.</div>}
    </div>
  );
}
function FoodCard({ f, theme }) {
  const [open, setOpen] = useState(false);
  return (
    <Panel theme={theme} className="p-3.5">
      <div className="flex items-center justify-between cursor-pointer" onClick={() => setOpen((o) => !o)}>
        <div>
          <div style={{ fontWeight: 600, fontSize: 13.5 }}>{f.name}</div>
          <div style={{ fontSize: 10.5, color: theme.textFaint }}>{CAT_LABEL[f.cat] || f.cat} · {f.region} · {f.diet}</div>
        </div>
        <div className="flex items-center gap-2">
          <span style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 12, color: theme.accent }}>{round(f.per100.cal)} kcal</span>
          {open ? <ChevronDown size={14} color={theme.textFaint} /> : <ChevronRight size={14} color={theme.textFaint} />}
        </div>
      </div>
      {open && (
        <div className="grid grid-cols-4 gap-2 mt-3 pt-3" style={{ borderTop: `1px solid ${theme.divider}` }}>
          {[["Protein", f.per100.protein], ["Carbs", f.per100.carbs], ["Fat", f.per100.fat], ["Fibre", f.per100.fiber]].map(([l, v]) => (
            <div key={l}><div style={{ fontSize: 13, fontWeight: 600 }}>{v}g</div><div style={{ fontSize: 9.5, color: theme.textFaint }}>{l}/100g</div></div>
          ))}
        </div>
      )}
    </Panel>
  );
}

function DailyTab({ theme, activeDay, setActiveDay, week, foodIndex, targetCalories, mealPct, mealTimes, setMealTimes, addItem, removeItem, editOverride, dToday, patient, balanceDay, macroGrams }) {
  const day = week[activeDay];
  return (
    <div className="flex flex-col gap-5">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <h1 style={{ fontFamily: "Space Grotesk, sans-serif", fontSize: 22, fontWeight: 700 }}>Meal Builder</h1>
        <div className="flex gap-1.5 flex-wrap">
          {DAYS.map((d) => <Pill key={d} theme={theme} active={activeDay === d} onClick={() => setActiveDay(d)}>{d.slice(0, 3)}</Pill>)}
        </div>
      </div>

      <div className="grid gap-4" style={{ gridTemplateColumns: "260px 1fr" }}>
        <div className="flex flex-col gap-3">
          <Panel theme={theme} className="p-4 flex flex-col items-center">
            <NutrientRing value={dToday.cal} target={targetCalories} color={theme.accent} label="Calories" unit="kcal" theme={theme} size={160} />
            <Btn theme={theme} small variant="soft" icon={Sparkles} style={{ marginTop: 10 }} onClick={balanceDay}>Balance Day</Btn>
          </Panel>
          <Panel theme={theme} className="p-4 flex flex-col gap-2.5">
            {[["Protein", dToday.protein, macroGrams.protein, theme.accent], ["Carbs", dToday.carbs, macroGrams.carbs, theme.accent2], ["Fat", dToday.fat, macroGrams.fat, theme.warn]].map(([l, v, t, c]) => (
              <div key={l}>
                <div className="flex justify-between" style={{ fontSize: 11.5, marginBottom: 3 }}>
                  <span style={{ color: theme.textMuted }}>{l}</span><span style={{ fontFamily: "JetBrains Mono, monospace" }}>{round(v, 1)} / {round(t, 1)}g</span>
                </div>
                <MiniBar value={v} target={t} color={c} theme={theme} />
              </div>
            ))}
            <div className="flex justify-between" style={{ fontSize: 11.5, marginTop: 4 }}>
              <span style={{ color: theme.textMuted }}>Fibre</span><span style={{ fontFamily: "JetBrains Mono, monospace" }}>{round(dToday.fiber, 1)}g</span>
            </div>
          </Panel>
        </div>
        <div className="flex flex-col gap-3">
          {MEAL_SLOTS.map((slot) => (
            <MealCard key={slot.key} slot={slot} items={day[slot.key]} foodIndex={foodIndex} theme={theme}
              targetCal={(mealPct[slot.key] / 100) * targetCalories} patient={patient}
              mealTime={mealTimes[slot.key]} onTimeChange={(v) => setMealTimes((t) => ({ ...t, [slot.key]: v }))}
              onAdd={(item) => addItem(activeDay, slot.key, item)}
              onRemove={(uid) => removeItem(activeDay, slot.key, uid)}
              onEditOverride={(uid, ov) => editOverride(activeDay, slot.key, uid, ov)} />
          ))}
        </div>
      </div>
    </div>
  );
}

function WeeklyTab({ theme, week, foodIndex, setActiveDay, setTab, copyDay, wTotalsArr, targetCalories, setWeek }) {
  const [copyFrom, setCopyFrom] = useState("Monday");
  const [copyTo, setCopyTo] = useState("Tuesday");
  const clearDay = (day) => setWeek((w) => ({ ...w, [day]: emptyDay() }));

  return (
    <div className="flex flex-col gap-5">
      <h1 style={{ fontFamily: "Space Grotesk, sans-serif", fontSize: 22, fontWeight: 700 }}>Weekly Diet Planner</h1>

      <Panel theme={theme} className="p-4 flex flex-wrap items-center gap-2.5">
        <span style={{ fontSize: 12.5, color: theme.textMuted }}>Copy</span>
        <Select theme={theme} value={copyFrom} onChange={(e) => setCopyFrom(e.target.value)} style={{ width: 130 }}>{DAYS.map((d) => <option key={d}>{d}</option>)}</Select>
        <span style={{ fontSize: 12.5, color: theme.textMuted }}>to</span>
        <Select theme={theme} value={copyTo} onChange={(e) => setCopyTo(e.target.value)} style={{ width: 130 }}>{DAYS.map((d) => <option key={d}>{d}</option>)}</Select>
        <Btn theme={theme} small icon={Copy} onClick={() => copyDay(copyFrom, copyTo)}>Copy Day</Btn>
      </Panel>

      <div style={{ overflowX: "auto" }}>
        <div style={{ display: "grid", gridTemplateColumns: `120px repeat(${DAYS.length}, minmax(150px,1fr))`, gap: 6, minWidth: 900 }}>
          <div />
          {DAYS.map((d) => (
            <div key={d} className="flex items-center justify-between px-1">
              <span style={{ fontSize: 12, fontWeight: 700 }}>{d.slice(0, 3)}</span>
              <Trash2 size={12} color={theme.textFaint} style={{ cursor: "pointer" }} onClick={() => clearDay(d)} />
            </div>
          ))}
          {MEAL_SLOTS.map((slot) => (
            <React.Fragment key={slot.key}>
              <div style={{ fontSize: 11.5, color: theme.textMuted, alignSelf: "start", paddingTop: 8 }}>{slot.label}</div>
              {DAYS.map((d) => {
                const items = week[d][slot.key];
                return (
                  <div key={d} onClick={() => { setActiveDay(d); setTab("daily"); }} className="cursor-pointer p-2 rounded-lg"
                    style={{ background: theme.panel, border: `1px solid ${theme.panelBorder}`, minHeight: 46, fontSize: 11 }}>
                    {items.length === 0 ? <span style={{ color: theme.textFaint }}>+ add</span> : items.map((it) => (
                      <div key={it.uid} style={{ color: theme.text, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                        {(foodIndex[it.foodId] || {}).name || "item"} <span style={{ color: theme.textFaint }}>({it.qty}{it.unit})</span>
                      </div>
                    ))}
                  </div>
                );
              })}
            </React.Fragment>
          ))}
          <div style={{ fontSize: 11.5, fontWeight: 700, alignSelf: "center" }}>Total</div>
          {DAYS.map((d, i) => (
            <div key={d} className="p-2 rounded-lg text-center" style={{ background: `${theme.accent}10`, border: `1px solid ${theme.accent}33` }}>
              <div style={{ fontWeight: 700, fontFamily: "JetBrains Mono, monospace", color: theme.accent, fontSize: 13 }}>{round(wTotalsArr[i].cal)} kcal</div>
              <div style={{ fontSize: 9.5, color: wTotalsArr[i].cal > targetCalories + 100 || wTotalsArr[i].cal < targetCalories - 100 ? theme.warn : theme.textFaint }}>
                target {round(targetCalories)}
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function ChartTab({ theme, patient, week, foodIndex, targetCalories, macroGrams, weekAvg, instructions, setInstructions, wTotalsArr }) {
  const [newInstr, setNewInstr] = useState("");
  return (
    <div className="flex flex-col gap-4">
      <div className="no-print flex items-center justify-between flex-wrap gap-3">
        <h1 style={{ fontFamily: "Space Grotesk, sans-serif", fontSize: 22, fontWeight: 700 }}>Diet Chart & Export</h1>
        <Btn theme={theme} icon={Printer} onClick={() => window.print()}>Print / Export PDF</Btn>
      </div>

      <Panel theme={theme} className="no-print p-4">
        <div style={{ fontWeight: 700, marginBottom: 8, fontSize: 13 }}>Patient Instructions</div>
        <div className="flex flex-col gap-1.5 mb-2">
          {instructions.map((ins, i) => (
            <div key={i} className="flex items-center justify-between" style={{ fontSize: 12.5, color: theme.textMuted }}>
              <span>• {ins}</span>
              <X size={12} style={{ cursor: "pointer" }} onClick={() => setInstructions((l) => l.filter((_, j) => j !== i))} />
            </div>
          ))}
        </div>
        <div className="flex gap-2">
          <TextInput theme={theme} value={newInstr} onChange={(e) => setNewInstr(e.target.value)} placeholder="Add instruction…" />
          <Btn theme={theme} small icon={Plus} onClick={() => { if (newInstr.trim()) { setInstructions((l) => [...l, newInstr.trim()]); setNewInstr(""); } }}>Add</Btn>
        </div>
      </Panel>

      <Panel theme={theme} className="print-area p-7" style={{ background: theme.bg2 }}>
        <div className="flex items-center justify-between flex-wrap gap-3 pb-4" style={{ borderBottom: `2px solid ${theme.accent}` }}>
          <div>
            <div style={{ fontSize: 20, fontWeight: 700, fontFamily: "Space Grotesk, sans-serif" }}>NutriCore Clinical Nutrition</div>
            <div style={{ fontSize: 11, color: theme.textFaint }}>Personalised Diet Chart · Generated {new Date().toLocaleDateString()}</div>
          </div>
          <div style={{ textAlign: "right", fontSize: 12 }}>
            <div><b>{patient.name || "Unnamed Patient"}</b> · {patient.patientId}</div>
            <div style={{ color: theme.textFaint }}>{patient.age} yrs · {patient.gender} · {patient.height}cm · {patient.weight}kg</div>
            <div style={{ color: theme.textFaint }}>Target: {round(targetCalories)} kcal/day · Goal: weight management</div>
          </div>
        </div>

        {DAYS.map((day, di) => {
          const d = week[day];
          const totals = wTotalsArr[di];
          const hasItems = MEAL_SLOTS.some((m) => d[m.key].length > 0);
          return (
            <div key={day} style={{ marginTop: 20, breakInside: "avoid" }}>
              <div style={{ fontWeight: 700, fontSize: 14, color: theme.accent, marginBottom: 6 }}>{day}</div>
              {!hasItems ? <div style={{ fontSize: 11.5, color: theme.textFaint }}>No meals planned yet.</div> : (
                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 11.5 }}>
                  <thead>
                    <tr style={{ borderBottom: `1px solid ${theme.divider}`, color: theme.textFaint, textAlign: "left" }}>
                      <th style={{ padding: "4px 6px" }}>Meal</th><th>Food</th><th>Qty</th><th>Calories</th>
                    </tr>
                  </thead>
                  <tbody>
                    {MEAL_SLOTS.map((m) => d[m.key].map((it, idx) => {
                      const n = itemNutrients(it, foodIndex);
                      return (
                        <tr key={it.uid} style={{ borderBottom: `1px solid ${theme.divider}` }}>
                          <td style={{ padding: "3px 6px", color: theme.textFaint }}>{idx === 0 ? `${m.label}` : ""}</td>
                          <td>{(foodIndex[it.foodId] || {}).name || "Custom item"}</td>
                          <td>{it.qty}{it.unit}</td>
                          <td>{round(n.cal)} kcal</td>
                        </tr>
                      );
                    }))}
                  </tbody>
                </table>
              )}
              <div style={{ fontSize: 11, color: theme.textMuted, marginTop: 4 }}>
                Total: {round(totals.cal)} kcal · P {round(totals.protein)}g · C {round(totals.carbs)}g · F {round(totals.fat)}g · Fibre {round(totals.fiber)}g
              </div>
            </div>
          );
        })}

        <div style={{ marginTop: 24, paddingTop: 14, borderTop: `2px solid ${theme.accent}` }}>
          <div style={{ fontWeight: 700, marginBottom: 6 }}>Weekly Nutrition Summary</div>
          <div className="flex gap-6 flex-wrap" style={{ fontSize: 12.5 }}>
            <span>Avg Calories: <b>{round(weekAvg.cal)}</b> kcal</span>
            <span>Avg Protein: <b>{round(weekAvg.protein)}</b> g</span>
            <span>Avg Carbs: <b>{round(weekAvg.carbs)}</b> g</span>
            <span>Avg Fat: <b>{round(weekAvg.fat)}</b> g</span>
            <span>Avg Fibre: <b>{round(weekAvg.fiber)}</b> g</span>
          </div>
        </div>

        {instructions.length > 0 && (
          <div style={{ marginTop: 18 }}>
            <div style={{ fontWeight: 700, marginBottom: 6 }}>Instructions</div>
            <ul style={{ fontSize: 12, color: theme.textMuted, paddingLeft: 18 }}>
              {instructions.map((ins, i) => <li key={i}>{ins}</li>)}
            </ul>
          </div>
        )}
        <div style={{ marginTop: 18, fontSize: 10, color: theme.textFaint }}>
          This chart is a planning tool prepared by a dietitian and does not constitute a medical diagnosis. Nutrient values are approximate, based on typical Indian food composition data.
        </div>
      </Panel>
    </div>
  );
}

function AnalyticsTab({ theme, weeklyBarData, macroChartData, targetCalories, wTotalsArr, weekAvg, microTargets }) {
  return (
    <div className="flex flex-col gap-5">
      <h1 style={{ fontFamily: "Space Grotesk, sans-serif", fontSize: 22, fontWeight: 700 }}>Nutrition Analytics</h1>
      <div className="grid gap-4" style={{ gridTemplateColumns: "1.4fr 1fr" }}>
        <Panel theme={theme} className="p-5">
          <div style={{ fontWeight: 700, marginBottom: 12 }}>Daily Calories vs Target</div>
          <div style={{ height: 260 }}>
            <ResponsiveContainer width="100%" height="100%">
              <BarChart data={weeklyBarData}>
                <CartesianGrid strokeDasharray="3 3" stroke={theme.divider} />
                <XAxis dataKey="day" stroke={theme.textFaint} fontSize={11} />
                <YAxis stroke={theme.textFaint} fontSize={11} />
                <Tooltip contentStyle={{ background: theme.bg2, border: `1px solid ${theme.panelBorder}`, borderRadius: 8, fontSize: 12 }} />
                <Bar dataKey="calories" fill={theme.accent} radius={[6, 6, 0, 0]} />
              </BarChart>
            </ResponsiveContainer>
          </div>
        </Panel>
        <Panel theme={theme} className="p-5">
          <div style={{ fontWeight: 700, marginBottom: 12 }}>Avg Macro Distribution</div>
          <div style={{ height: 220 }}>
            <ResponsiveContainer width="100%" height="100%">
              <PieChart>
                <Pie data={macroChartData} dataKey="value" nameKey="name" innerRadius={45} outerRadius={80} paddingAngle={3}>
                  {macroChartData.map((e, i) => <Cell key={i} fill={e.color} stroke="none" />)}
                </Pie>
                <Tooltip contentStyle={{ background: theme.bg2, border: `1px solid ${theme.panelBorder}`, borderRadius: 8, fontSize: 12 }} />
              </PieChart>
            </ResponsiveContainer>
          </div>
        </Panel>
      </div>
      <Panel theme={theme} className="p-5">
        <div style={{ fontWeight: 700, marginBottom: 12 }}>Micronutrient Adequacy (weekly average)</div>
        <div className="flex flex-col gap-3">
          {[["fiber", weekAvg.fiber, theme.fiber], ["sugar", weekAvg.sugar, theme.warn], ["sodium", weekAvg.sodium, theme.danger]].map(([k, v, c]) => (
            <div key={k}>
              <div className="flex justify-between" style={{ fontSize: 12, marginBottom: 3 }}>
                <span style={{ textTransform: "capitalize", color: theme.textMuted }}>{k}</span>
                <span style={{ fontFamily: "JetBrains Mono, monospace" }}>{round(v, 1)} / {microTargets[k]}{k === "sodium" ? "mg" : "g"}</span>
              </div>
              <MiniBar value={v} target={microTargets[k]} color={c} theme={theme} />
            </div>
          ))}
        </div>
      </Panel>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
